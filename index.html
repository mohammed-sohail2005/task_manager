<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPulse Pro 3D - Executive Task Manager</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Animated Gradient & Orbs -->
    <div class="bg-gradient-container">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="grid-overlay"></div>
    </div>

    <!-- Main Container -->
    <main class="app-container">
        <!-- 3D Glassmorphism Executive Card -->
        <div class="glass-card" id="glassCard">
            <!-- Glass Sheen Overlay -->
            <div class="card-shine"></div>

            <!-- Header & Dashboard Stats -->
            <header class="dashboard-header">
                <div class="header-left">
                    <div class="app-logo">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"></path>
                            <path d="m9 12 2 2 4-4"></path>
                        </svg>
                    </div>
                    <div class="header-text">
                        <div class="title-row">
                            <h1>TaskPulse Pro</h1>
                            <span class="pro-badge">PRO</span>
                        </div>
                        <p id="currentDate">Executive Focus & Task Suite</p>
                    </div>
                </div>

                <!-- 3D Progress Ring Widget -->
                <div class="progress-ring-container">
                    <svg class="progress-ring" width="76" height="76" viewBox="0 0 76 76">
                        <circle class="progress-ring-bg" cx="38" cy="38" r="30" stroke-width="6" fill="transparent" />
                        <circle class="progress-ring-circle" id="progressRingCircle" cx="38" cy="38" r="30" stroke-width="6" fill="transparent" />
                    </svg>
                    <div class="progress-text-box">
                        <span class="progress-percentage" id="progressPercentage">0%</span>
                        <span class="progress-label">DONE</span>
                    </div>
                </div>
            </header>

            <!-- Productivity Metrics Bar -->
            <section class="metrics-bar">
                <div class="metric-card">
                    <span class="metric-label">Total Tasks</span>
                    <span class="metric-value" id="metricTotal">0</span>
                </div>
                <div class="metric-card">
                    <span class="metric-label">Pending</span>
                    <span class="metric-value yellow" id="metricPending">0</span>
                </div>
                <div class="metric-card">
                    <span class="metric-label">High Priority</span>
                    <span class="metric-value red" id="metricHigh">0</span>
                </div>
                <div class="metric-card">
                    <span class="metric-label">Completed</span>
                    <span class="metric-value green" id="metricCompleted">0</span>
                </div>
            </section>

            <!-- Task Input Form & Priority Selection -->
            <section class="task-input-section">
                <form id="taskForm" class="input-form">
                    <div class="input-row">
                        <div class="input-field-container">
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="12" y1="8" x2="12" y2="16"></line>
                                <line x1="8" y1="12" x2="16" y2="12"></line>
                            </svg>
                            <input type="text" id="taskInput" placeholder="Add a new executive task..." autocomplete="off" maxlength="140" required>
                        </div>
                        <button type="submit" class="add-btn" id="addBtn">
                            <span>Add Task</span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>
                    </div>

                    <!-- Priority Selector Chips -->
                    <div class="priority-selector-row">
                        <span class="priority-selector-label">Priority:</span>
                        <div class="priority-chips">
                            <label class="priority-chip priority-low">
                                <input type="radio" name="priorityOption" value="low" checked>
                                <span>Low</span>
                            </label>
                            <label class="priority-chip priority-medium">
                                <input type="radio" name="priorityOption" value="medium">
                                <span>Medium</span>
                            </label>
                            <label class="priority-chip priority-high">
                                <input type="radio" name="priorityOption" value="high">
                                <span>High 🔥</span>
                            </label>
                        </div>
                    </div>
                </form>
            </section>

            <!-- Search, Filter & Sort Controls -->
            <section class="controls-section">
                <div class="search-sort-row">
                    <!-- Search Bar -->
                    <div class="search-wrapper">
                        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="searchInput" placeholder="Search tasks..." autocomplete="off">
                        <button class="clear-search-btn hidden" id="clearSearchBtn" title="Clear search">×</button>
                    </div>

                    <!-- Sort Dropdown -->
                    <div class="sort-wrapper">
                        <label for="sortSelect">Sort:</label>
                        <select id="sortSelect" class="sort-select">
                            <option value="date-desc">Newest First</option>
                            <option value="date-asc">Oldest First</option>
                            <option value="priority">Priority (High $\rightarrow$ Low)</option>
                            <option value="alpha">Alphabetical</option>
                        </select>
                    </div>
                </div>

                <!-- Status Filter Tabs & Actions -->
                <div class="filter-actions-row">
                    <div class="filter-tabs">
                        <button class="filter-btn active" data-filter="all">All <span class="badge" id="countAll">0</span></button>
                        <button class="filter-btn" data-filter="active">Active <span class="badge" id="countActive">0</span></button>
                        <button class="filter-btn" data-filter="completed">Done <span class="badge" id="countCompleted">0</span></button>
                        <button class="filter-btn" data-filter="high">High 🔥 <span class="badge" id="countHighFilter">0</span></button>
                    </div>
                    <button class="clear-btn" id="clearCompletedBtn" title="Clear all completed tasks">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                        <span>Clear Done</span>
                    </button>
                </div>
            </section>

            <!-- Task List & Empty State Container -->
            <section class="task-list-container">
                <ul class="task-list" id="taskList">
                    <!-- Dynamic Task Cards Rendered Here -->
                </ul>

                <!-- Empty State Illustration -->
                <div class="empty-state hidden" id="emptyState">
                    <div class="empty-illustration">
                        <div class="illustration-ring"></div>
                        <svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                    </div>
                    <h3 class="empty-title" id="emptyTitle">All tasks completed!</h3>
                    <p class="empty-subtitle" id="emptySubtitle">You have no tasks pending right now. Add a task above to stay productive!</p>
                </div>
            </section>

            <!-- Footer Info -->
            <footer class="card-footer">
                <span class="footer-stats" id="taskStatsSummary">0 tasks remaining</span>
                <span class="footer-hint">Double-click or click Edit to modify inline</span>
            </footer>
        </div>
    </main>

    <!-- Undo Deletion Toast Notification -->
    <div class="toast" id="undoToast" role="status">
        <div class="toast-content">
            <div class="toast-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="1 4 1 10 7 10"></polyline>
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                </svg>
            </div>
            <span class="toast-message">Task deleted</span>
            <button class="undo-btn" id="undoBtn">Undo ↩️</button>
        </div>
        <div class="toast-progress" id="toastProgress"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
