<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPulse 3D - Modern Glassmorphism Task Manager</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Animated Orbs & Particles -->
    <div class="bg-gradient-container">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="grid-overlay"></div>
    </div>

    <!-- Main Container -->
    <main class="app-container">
        <!-- 3D Glassmorphism Dashboard Card -->
        <div class="glass-card" id="glassCard">
            <!-- Card Header & Progress Ring Section -->
            <header class="dashboard-header">
                <div class="header-left">
                    <div class="app-logo">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"></path>
                            <path d="m9 12 2 2 4-4"></path>
                        </svg>
                    </div>
                    <div class="header-text">
                        <h1>TaskPulse 3D</h1>
                        <p id="currentDate">Manage your daily focus</p>
                    </div>
                </div>

                <!-- 3D Progress Ring Widget -->
                <div class="progress-ring-container">
                    <svg class="progress-ring" width="70" height="70" viewBox="0 0 70 70">
                        <circle class="progress-ring-bg" cx="35" cy="35" r="28" stroke-width="6" fill="transparent" />
                        <circle class="progress-ring-circle" id="progressRingCircle" cx="35" cy="35" r="28" stroke-width="6" fill="transparent" />
                    </svg>
                    <div class="progress-text-box">
                        <span class="progress-percentage" id="progressPercentage">0%</span>
                    </div>
                </div>
            </header>

            <!-- Task Input Form -->
            <section class="task-input-section">
                <form id="taskForm" class="input-wrapper">
                    <div class="input-field-container">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="16"></line>
                            <line x1="8" y1="12" x2="16" y2="12"></line>
                        </svg>
                        <input type="text" id="taskInput" placeholder="What needs to be done today?" autocomplete="off" maxlength="120" required>
                    </div>
                    <button type="submit" class="add-btn" id="addBtn">
                        <span>Add Task</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </form>
            </section>

            <!-- Controls & Filters Bar -->
            <section class="controls-bar">
                <div class="filter-tabs">
                    <button class="filter-btn active" data-filter="all">All <span class="badge" id="countAll">0</span></button>
                    <button class="filter-btn" data-filter="active">Active <span class="badge" id="countActive">0</span></button>
                    <button class="filter-btn" data-filter="completed">Completed <span class="badge" id="countCompleted">0</span></button>
                </div>
                <button class="clear-btn" id="clearCompletedBtn" title="Clear all completed tasks">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    <span>Clear Done</span>
                </button>
            </section>

            <!-- Task List & Empty State Container -->
            <section class="task-list-container">
                <ul class="task-list" id="taskList">
                    <!-- Dynamic Task Items Rendered Here -->
                </ul>

                <!-- Empty State Illustration -->
                <div class="empty-state hidden" id="emptyState">
                    <div class="empty-illustration">
                        <div class="illustration-ring"></div>
                        <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                    </div>
                    <h3 class="empty-title">All tasks completed!</h3>
                    <p class="empty-subtitle">You have no tasks pending right now. Add a task above to stay productive!</p>
                </div>
            </section>

            <!-- Footer Stats -->
            <footer class="card-footer">
                <span class="footer-stats" id="taskStatsSummary">0 tasks remaining</span>
                <span class="footer-hint">Pro-tip: Click checkmark to complete</span>
            </footer>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
